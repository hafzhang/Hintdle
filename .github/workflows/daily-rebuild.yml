name: daily rebuild

on:
  schedule:
    # 08:10 UTC = 北京时间 16:10，官方换题（08:00 UTC）后留 10 分钟余量。
    # 注意 GitHub 的 cron 只会晚不会早，这里刻意不用 08:00 整点：
    # 站点按构建时刻算题号，卡在整点那一毫秒有可能仍算作前一天。
    - cron: '10 8 * * *'
  workflow_dispatch:

# 需要写权限才能把刷新后的数据 push 回仓库
permissions:
  contents: write

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 校验官方 bundle：一致则只写当日存档 + 告警；有漂移则重建词图与题目序列
      - name: check the official bundle and write today's archive
        run: python scripts/daily_sync.py --check-only

      # 每天都会新增一个 data/daily/<日期>.json，所以这里正常每天都有提交。
      # 提交不只是留痕：仓库连续 60 天无活动会被 GitHub 静默停用定时任务，
      # 而本仓库的数据平时几乎不变，正是最容易撞上这条规则的情况。
      - name: commit the refreshed data
        run: |
          if [ -n "$(git status --porcelain -- data/processed data/daily)" ]; then
            git config user.name "hintdle-bot"
            git config user.email "bot@hintdle.com"
            git add data/processed data/daily
            git commit -m "data: daily sync $(date -u +%F)"
            git push
          else
            echo "no data change"
          fi

      # 无条件调用，不依赖「push 会不会触发 Vercel」这个假设。
      # 站点每天必须重建一次，否则 /、/answer-today/、/hints/、/yesterday/
      # 会一直停在前一天；漏一次部署就是一天错误答案。
      - name: trigger the Vercel rebuild
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
